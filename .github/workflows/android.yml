name: Application Android

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-app
    steps:
      - uses: actions/checkout@v4

      - name: Récupérer la clé de signature (secrets du dépôt)
        env:
          KS_PW: ${{ secrets.KEYSTORE_PASSWORD }}
          KS_B64: ${{ secrets.KEYSTORE_B64 }}
        run: |
          if [ -z "$KS_PW" ] || [ -z "$KS_B64" ]; then
            echo "::error::Ajoutez les secrets KEYSTORE_B64 et KEYSTORE_PASSWORD (Settings > Secrets and variables > Actions), puis relancez."
            exit 1
          fi
          mkdir -p keystore
          echo "$KS_B64" | base64 -d > keystore/carnet.jks

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Copier l'application web (sans service worker)
        run: |
          mkdir -p www
          cp ../index.html ../icon-192.png ../icon-512.png www/
          sed -i '/serviceWorker/d' www/index.html

      - name: Installer Capacitor
        run: npm install --no-audit --no-fund

      - name: Créer le projet Android
        run: |
          npx cap add android
          npx @capacitor/assets generate --android \
            --iconBackgroundColor '#060914' --iconBackgroundColorDark '#060914' \
            --splashBackgroundColor '#060914' --splashBackgroundColorDark '#060914'
          npx cap sync android

      - name: Numéro de version
        run: |
          sed -i "s/versionCode [0-9]*/versionCode ${{ github.run_number }}/" android/app/build.gradle
          sed -i "s/versionName \"[^\"]*\"/versionName \"1.${{ github.run_number }}\"/" android/app/build.gradle

      - name: Compiler
        working-directory: android-app/android
        run: ./gradlew assembleRelease --no-daemon

      - name: Signer
        env:
          KS_PW: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$BT/zipalign" -p -f 4 android/app/build/outputs/apk/release/app-release-unsigned.apk aligned.apk
          "$BT/apksigner" sign --ks keystore/carnet.jks --ks-key-alias carnet \
            --ks-pass env:KS_PW --key-pass env:KS_PW \
            --out Carnet-de-menus.apk aligned.apk
          "$BT/apksigner" verify Carnet-de-menus.apk

      - name: Publier le fichier .apk
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.${{ github.run_number }}
          name: Carnet de menus 1.${{ github.run_number }}
          body: "Téléchargez **Carnet-de-menus.apk** ci-dessous depuis votre téléphone Android, puis ouvrez-le pour l'installer."
          files: android-app/Carnet-de-menus.apk
          make_latest: true
