name: Application Android

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-app
    steps:
      - uses: actions/checkout@v4

      - name: Récupérer la clé de signature (secrets du dépôt)
        env:
          KS_PW: ${{ secrets.KEYSTORE_PASSWORD }}
          KS_B64: ${{ secrets.KEYSTORE_B64 }}
        run: |
          if [ -z "$KS_PW" ] || [ -z "$KS_B64" ]; then
            echo "::error::Ajoutez les secrets KEYSTORE_B64 et KEYSTORE_PASSWORD (Settings > Secrets and variables > Actions), puis relancez."
            exit 1
          fi
          mkdir -p keystore
          echo "$KS_B64" | base64 -d > keystore/carnet.jks

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Préparer l'application (polices intégrées, hors connexion)
        run: python3 prepare.py

      - name: Installer Capacitor
        run: npm install --no-audit --no-fund

      - name: Créer le projet Android
        run: |
          npx cap add android
          npx @capacitor/assets generate --android \
            --iconBackgroundColor '#efe5d1' --iconBackgroundColorDark '#efe5d1' \
            --splashBackgroundColor '#efe5d1' --splashBackgroundColorDark '#efe5d1'
          npx cap sync android

      - name: Numéro de version
        run: |
          sed -i "s/versionCode [0-9]*/versionCode ${{ github.run_number }}/" android/app/build.gradle
          sed -i "s/versionName \"[^\"]*\"/versionName \"1.${{ github.run_number }}\"/" android/app/build.gradle
          grep -E "targetSdkVersion|compileSdkVersion" android/variables.gradle

      - name: Compiler (APK pour installer, AAB pour le Play Store)
        working-directory: android-app/android
        run: ./gradlew assembleRelease bundleRelease --no-daemon

      - name: Signer
        env:
          KS_PW: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$BT/zipalign" -p -f 4 android/app/build/outputs/apk/release/app-release-unsigned.apk aligned.apk
          "$BT/apksigner" sign --ks keystore/carnet.jks --ks-key-alias carnet \
            --ks-pass env:KS_PW --key-pass env:KS_PW \
            --out Carnet-de-menus.apk aligned.apk
          "$BT/apksigner" verify Carnet-de-menus.apk
          cp android/app/build/outputs/bundle/release/app-release.aab Carnet-de-menus-PlayStore.aab
          jarsigner -sigalg SHA256withRSA -digestalg SHA-256 \
            -keystore keystore/carnet.jks -storepass:env KS_PW -keypass:env KS_PW \
            Carnet-de-menus-PlayStore.aab carnet
          jarsigner -verify Carnet-de-menus-PlayStore.aab | tail -1

      - name: Publier
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.${{ github.run_number }}
          name: Carnet de menus 1.${{ github.run_number }}
          body: |
            - **Carnet-de-menus.apk** : à télécharger depuis votre téléphone Android pour l'installer directement.
            - **Carnet-de-menus-PlayStore.aab** : le fichier à envoyer dans la Google Play Console.
          files: |
            android-app/Carnet-de-menus.apk
            android-app/Carnet-de-menus-PlayStore.aab
          make_latest: true
