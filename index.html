<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Carnet de menus</title>
<meta name="description" content="Dîners de la semaine, recettes de terroir, calories et liste de courses.">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#060914">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Menus">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<style>
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;font:14px system-ui,-apple-system,sans-serif;overscroll-behavior-y:none}
img{max-width:100%}[hidden]{display:none!important}
html,body{-webkit-user-select:none;user-select:none}
input,textarea{-webkit-user-select:text;user-select:text}
</style>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@400;500;600&family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout: phone-first notebook — compact sticky header, content column, thumb-reach tab bar at the bottom, everything secondary in bottom sheets */
:root{
  --bg:#f5f6f1; --surface:#ffffff; --ink:#1c231f; --muted:#5f6a63; --line:#e1e5dc; --soft:#eceee8;
  --accent:#9a2c3b; --accent-ink:#ffffff; --spice:#a8720c; --spice-soft:#f7ecd3; --leaf:#2f6b4a; --leaf-soft:#e2efe6; --sea:#24597a; --sea-soft:#e0ecf3;
  --scrim:rgba(10,14,12,.42);
  --display:"Young Serif", Georgia, "Times New Roman", serif;
  --body:"Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
  --nav:64px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#131714; --surface:#1b201c; --ink:#e7ebe4; --muted:#9aa59d; --line:#2a312c; --soft:#222824;
  --accent:#e27b89; --accent-ink:#1a0d10; --spice:#e6b54a; --spice-soft:#3a3020; --leaf:#7cc49a; --leaf-soft:#1f3328; --sea:#86bfe0; --sea-soft:#1c2c37; --scrim:rgba(0,0,0,.6); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#131714; --surface:#1b201c; --ink:#e7ebe4; --muted:#9aa59d; --line:#2a312c; --soft:#222824;
  --accent:#e27b89; --accent-ink:#1a0d10; --spice:#e6b54a; --spice-soft:#3a3020; --leaf:#7cc49a; --leaf-soft:#1f3328; --sea:#86bfe0; --sea-soft:#1c2c37; --scrim:rgba(0,0,0,.6); color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.45;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
button{font-family:var(--body);color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
svg.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}

.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
.top-in{max-width:640px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px 10px;display:flex;align-items:center;gap:12px}
.top h1{font-family:var(--display);font-weight:400;font-size:1.35rem;margin:0;line-height:1.1}
.top .sub{color:var(--muted);font-size:.82rem}
.top .grow{flex:1;min-width:0}
.wrap{max-width:640px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px calc(var(--nav) + 96px + env(safe-area-inset-bottom,0px))}

.nav{position:fixed;left:0;right:0;bottom:0;z-index:15;background:var(--surface);border-top:1px solid var(--line);padding-left:max(8px,env(safe-area-inset-left,0px));padding-right:max(8px,env(safe-area-inset-right,0px));padding-block:6px calc(6px + env(safe-area-inset-bottom,0px))}
.nav-in{max-width:640px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr)}
.nav button{border:0;background:transparent;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 2px;font-size:.72rem;font-weight:600;color:var(--muted);cursor:pointer;position:relative;border-radius:12px}
.nav button[aria-current="page"]{color:var(--accent)}
.nav button[aria-current="page"] svg.i{stroke-width:2.2}
.badge{position:absolute;top:2px;left:calc(50% + 6px);min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--accent);color:var(--accent-ink);font-size:.68rem;font-weight:700;line-height:18px;font-variant-numeric:tabular-nums}

.view{display:flex;flex-direction:column;gap:16px}
@media (prefers-reduced-motion:no-preference){
  .view{animation:fade .18s ease-out}
  @keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
  .btn,.iconbtn,.chip,.daybtn{transition:transform .08s ease,background-color .15s ease}
  .btn:active,.iconbtn:active,.chip:active,.daybtn:active{transform:scale(.96)}
}
.label{font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.note{color:var(--muted);font-size:.85rem}
.empty{color:var(--muted);font-style:italic}
.err{color:var(--accent);font-weight:600;font-size:.9rem}

.btn{border:0;background:var(--accent);color:var(--accent-ink);font-weight:700;padding:12px 16px;border-radius:14px;cursor:pointer;font-size:.95rem;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn.wide{flex:1}
.btn.ghost{background:var(--surface);color:var(--ink);border:1px solid var(--line);font-weight:600}
.btn.small{padding:8px 12px;font-size:.86rem;border-radius:11px}
.btn.danger{background:transparent;color:var(--accent);border:1px solid var(--accent)}
.iconbtn{border:1px solid var(--line);background:var(--surface);width:44px;height:44px;border-radius:14px;display:inline-grid;place-items:center;cursor:pointer;flex:none}
.iconbtn.flat{border-color:transparent;background:transparent}
.pill{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-weight:600;font-size:.85rem;cursor:pointer;white-space:nowrap}

.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips.scroll{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;margin-inline:-16px;padding-inline:16px;scroll-padding-inline:16px}
.chips.scroll::-webkit-scrollbar{display:none}
.chip{border:1px solid var(--line);background:var(--surface);padding:7px 12px;border-radius:999px;font-size:.88rem;cursor:pointer;white-space:nowrap;flex:none}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg);font-weight:600}
.chip.leaf[aria-pressed="true"]{background:var(--leaf-soft);border-color:var(--leaf);color:var(--leaf)}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--soft);border-radius:12px;padding:3px;gap:3px}
.seg button{border:0;background:transparent;padding:8px 6px;border-radius:9px;font-weight:600;font-size:.88rem;cursor:pointer;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}

.meta{display:flex;flex-wrap:wrap;gap:5px;font-size:.76rem}
.tag{padding:2px 7px;border-radius:6px;background:var(--soft);color:var(--ink);white-space:nowrap}
.tag.oven{background:var(--spice-soft);color:var(--spice);font-weight:600}
.tag.home{background:var(--leaf-soft);color:var(--leaf);font-weight:600}
.tag.fish{background:var(--sea-soft);color:var(--sea);font-weight:600}
.tag.mine{border:1px solid var(--muted);background:transparent}

/* Semaine */
.stats{display:flex;flex-wrap:wrap;gap:5px;font-size:.78rem}
.days{list-style:none;margin:0;padding:0;background:var(--surface);border:1px solid var(--line);border-radius:18px;overflow:hidden}
.day{display:grid;grid-template-columns:48px 1fr auto;gap:12px;align-items:center;padding:12px 10px 12px 14px;border-top:1px solid var(--line)}
.day:first-child{border-top:0}
.day.today{background:linear-gradient(90deg,var(--spice-soft),transparent 60%)}
.dname{font-weight:700;font-size:.9rem;line-height:1.1}
.ddate{color:var(--muted);font-size:.76rem;font-variant-numeric:tabular-nums}
.dish{min-width:0;display:flex;flex-direction:column;gap:4px}
.lunch{font-size:.78rem;color:var(--leaf);font-weight:600}
.dish-title{all:unset;cursor:pointer;font-family:var(--display);font-size:1.05rem;line-height:1.25;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.dish-title:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
.dact{display:flex;gap:2px}
.addday{all:unset;cursor:pointer;color:var(--muted);font-weight:600;font-size:.92rem;display:inline-flex;align-items:center;gap:6px}
.x2dot{color:var(--leaf);font-size:.74rem;font-weight:700}

/* Courses */
.progress-card{position:sticky;top:calc(env(safe-area-inset-top,0px) + 58px);z-index:3;background:var(--bg);padding-block:4px 8px;display:flex;flex-direction:column;gap:8px}
.progress{height:6px;background:var(--soft);border-radius:3px;overflow:hidden}
.progress i{display:block;height:100%;background:var(--leaf);transition:width .25s ease}
.rayon{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:6px 14px}
.rayon h3{margin:8px 0 2px;font-family:var(--display);font-weight:400;font-size:1.05rem;display:flex;justify-content:space-between;align-items:baseline}
.rayon h3 small{font-family:var(--body);font-size:.78rem;color:var(--muted);font-variant-numeric:tabular-nums}
.item{display:grid;grid-template-columns:26px 1fr auto;gap:10px;align-items:center;padding:10px 0;border-top:1px solid var(--line);cursor:pointer}
.rayon h3+.item{border-top:0}
.item input{width:20px;height:20px;margin:0;accent-color:var(--leaf)}
.iname{min-width:0}
.ifrom{display:block;color:var(--muted);font-size:.74rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.iqty{font-variant-numeric:tabular-nums;font-weight:600;white-space:nowrap}
.item.done .iname,.item.done .iqty{text-decoration:line-through;color:var(--muted)}
.item.home .iname::after{content:" · à la maison";color:var(--leaf);font-size:.76rem;font-weight:600}
.addrow{display:flex;gap:8px}
input[type=text],input[type=number],input[type=search],textarea,select{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:12px;padding:11px 12px;font:inherit;min-width:0;width:100%}
.addrow input{flex:1}
textarea{resize:vertical}

/* Recettes */
.searchbar{position:sticky;top:calc(env(safe-area-inset-top,0px) + 58px);z-index:3;background:var(--bg);padding-block:2px 10px;display:flex;flex-direction:column;gap:10px}
.searchwrap{position:relative}
.searchwrap svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--muted)}
.searchwrap input{padding-left:40px}
.rlist{display:flex;flex-direction:column;gap:8px}
.rcard{display:grid;grid-template-columns:1fr auto;gap:6px;padding:12px 8px 12px 14px;background:var(--surface);border:1px solid var(--line);border-radius:16px;align-items:start}
.rcard.banned{opacity:.5}
.rcard .open{all:unset;cursor:pointer;display:flex;flex-direction:column;gap:6px;min-width:0}
.rcard .open:focus-visible{outline:2px solid var(--accent);border-radius:6px}
.rcard .t{font-family:var(--display);font-size:1.04rem;line-height:1.25}
.star{border:0;background:transparent;width:40px;height:40px;display:grid;place-items:center;cursor:pointer;color:var(--muted);border-radius:12px}
.star[aria-pressed="true"]{color:var(--spice)}
.star[aria-pressed="true"] svg{fill:currentColor}
.banner{background:var(--spice-soft);border-radius:14px;padding:10px 12px;display:flex;justify-content:space-between;align-items:center;gap:10px}
.fab{position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(var(--nav) + 16px + env(safe-area-inset-bottom,0px));z-index:14;border:0;background:var(--accent);color:var(--accent-ink);border-radius:18px;padding:14px 18px;font-weight:700;display:inline-flex;align-items:center;gap:8px;cursor:pointer;box-shadow:0 6px 18px rgba(0,0,0,.18)}
.region{display:flex;flex-direction:column;gap:8px;scroll-margin-top:120px}
.region h3{margin:8px 0 0;font-family:var(--display);font-weight:400;font-size:1.25rem;display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.region h3 small{font-family:var(--body);font-size:.78rem;color:var(--muted)}

/* Sheets */
.sheet-bg{position:fixed;inset:0;background:var(--scrim);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:640px;max-height:92vh;overflow:auto;overscroll-behavior:contain;border-radius:22px 22px 0 0;padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:max(18px,env(safe-area-inset-right,0px));padding-block:8px calc(24px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:14px}
.grab{width:40px;height:5px;border-radius:3px;background:var(--line);margin:4px auto 2px;flex:none}
@media (prefers-reduced-motion:no-preference){
  .sheet-bg{animation:scrim .2s ease-out}.sheet{animation:up .24s cubic-bezier(.2,.8,.2,1)}
  .sheet-bg.closing{animation:scrimout .18s ease-in forwards}.sheet-bg.closing .sheet{animation:down .18s ease-in forwards}
  @keyframes up{from{transform:translateY(40px);opacity:.4}to{transform:none;opacity:1}}
  @keyframes down{to{transform:translateY(60px);opacity:0}}
  @keyframes scrim{from{opacity:0}}@keyframes scrimout{to{opacity:0}}
}
.sheet h2{font-family:var(--display);font-weight:400;font-size:1.4rem;margin:0;line-height:1.2}
.sheet-head{display:flex;gap:6px;align-items:flex-start}
.sheet-head h2{flex:1;min-width:0;padding-top:6px}
.week7{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.daybtn{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:8px 0;font-weight:700;font-size:.85rem;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:1px}
.daybtn small{font-weight:500;font-size:.66rem;color:var(--muted);font-variant-numeric:tabular-nums}
.daybtn.taken{background:var(--soft)}
.daybtn.here{background:var(--leaf-soft);border-color:var(--leaf);color:var(--leaf)}
.ing{list-style:none;margin:0;padding:0}
.ing li{display:grid;grid-template-columns:1fr auto;gap:10px;padding:9px 0;border-bottom:1px solid var(--line)}
.steps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px;counter-reset:s}
.steps li{display:grid;grid-template-columns:30px 1fr;gap:10px;padding:10px 12px;background:var(--surface);border:1px solid var(--line);border-radius:14px;cursor:pointer;counter-increment:s}
.steps li::before{content:counter(s);width:26px;height:26px;border-radius:50%;background:var(--soft);display:grid;place-items:center;font-weight:700;font-size:.82rem}
.steps li.ok{opacity:.55}.steps li.ok::before{content:"✓";background:var(--leaf-soft);color:var(--leaf)}
.steps li.ok .stxt{text-decoration:line-through}
.tbtn{margin-top:6px;border:1px solid var(--spice);background:transparent;color:var(--spice);font-weight:600;border-radius:999px;padding:4px 11px;font-size:.8rem;cursor:pointer;font-variant-numeric:tabular-nums;display:inline-flex;gap:5px;align-items:center}
.menu{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.menu button{all:unset;cursor:pointer;display:flex;align-items:center;gap:12px;padding:15px 16px;border-top:1px solid var(--line);font-weight:600}
.menu button:first-child{border-top:0}
.menu button:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.menu button.danger{color:var(--accent)}
.menu button[aria-pressed="true"]{color:var(--leaf)}
.similar{display:flex;flex-direction:column;gap:6px}
.simbtn{all:unset;cursor:pointer;padding:11px 13px;border:1px solid var(--line);border-radius:14px;background:var(--surface);display:flex;flex-direction:column;gap:2px}
.simbtn:focus-visible{outline:2px solid var(--accent)}
.simbtn b{font-family:var(--display);font-weight:400}
.simbtn span{font-size:.76rem;color:var(--muted)}
.group{display:flex;flex-direction:column;gap:10px}
.stepper{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:12px;background:var(--surface);overflow:hidden}
.stepper button{border:0;background:transparent;width:42px;height:42px;font-size:1.2rem;cursor:pointer}
.stepper output{min-width:72px;text-align:center;font-weight:700;font-variant-numeric:tabular-nums}
.setrow{display:flex;justify-content:space-between;align-items:center;gap:12px}
.form{display:flex;flex-direction:column;gap:12px}
.form label{display:flex;flex-direction:column;gap:5px;font-weight:600;font-size:.9rem}
.form .two{display:grid;grid-template-columns:1fr 1fr;gap:10px}

.timer{position:fixed;left:0;right:0;bottom:calc(var(--nav) + env(safe-area-inset-bottom,0px));z-index:16;background:var(--ink);color:var(--bg);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px;display:flex;align-items:center;gap:12px}
.timer .tl{flex:1;min-width:0;font-size:.85rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.timer .tv{font-family:var(--display);font-size:1.45rem;font-variant-numeric:tabular-nums}
.timer.ring{background:var(--accent);color:var(--accent-ink)}
.timer button{border:1px solid currentColor;background:transparent;border-radius:10px;padding:6px 10px;cursor:pointer;font-weight:600}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--nav) + 20px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;z-index:40;font-size:.9rem;max-width:calc(100% - 32px);font-weight:600}
@media (prefers-reduced-motion:no-preference){.toast{animation:fade .18s ease-out}}

/* ---- Pro layer ---- */
:root{--plate:#fbfaf6;--plate-rim:#ece7dc;--shadow:0 1px 2px rgba(20,30,25,.05),0 6px 20px rgba(20,30,25,.06);--tint:var(--accent)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--plate:#262c27;--plate-rim:#333b35;--shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25)}}
:root[data-theme="dark"]{--plate:#262c27;--plate-rim:#333b35;--shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25)}
.grow{flex:1;min-width:0}
.top h1{font-size:1.5rem;letter-spacing:-.01em}
.eyebrow{font-size:.7rem;letter-spacing:.1em;text-transform:uppercase;font-weight:700;color:var(--tint)}
.plate{width:56px;height:56px;flex:none;filter:drop-shadow(0 2px 3px rgba(0,0,0,.12))}
.plate.lg{width:112px;height:112px}
.plate.xl{width:128px;height:128px}
.hero{position:relative;display:flex;gap:14px;align-items:center;padding:18px;overflow:hidden;border-radius:24px;background:linear-gradient(135deg,color-mix(in oklab,var(--tint) 20%,var(--surface)),var(--surface) 75%);border:1px solid color-mix(in oklab,var(--tint) 25%,var(--line));box-shadow:var(--shadow)}
.hero-txt{flex:1;min-width:0;display:flex;flex-direction:column;gap:8px}
.hero-title{font-family:var(--display);font-weight:400;font-size:1.55rem;line-height:1.15;margin:0;text-wrap:balance;padding-right:96px}
.hero .plate.xl{position:absolute;right:-14px;top:30px;width:120px;height:120px}
.hero .facts{padding-right:96px}
.hero-act{display:flex;gap:8px;flex-wrap:wrap;margin-top:4px}
.hero .btn{padding:10px 14px}
.hero .next{font-size:.8rem;color:var(--muted)}
.empty-hero{background:var(--surface)}
.facts{display:flex;flex-wrap:wrap;gap:12px;font-size:.85rem;font-weight:600;color:var(--muted)}
.facts span{display:inline-flex;align-items:center;gap:5px}
.facts svg.i{width:16px;height:16px}
.facts.big{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;color:var(--ink)}
.facts.big span{flex-direction:column;gap:3px;padding:9px 4px;background:color-mix(in oklab,var(--surface) 70%,transparent);border-radius:12px;font-size:.78rem;text-align:center}
.facts.big svg.i{width:18px;height:18px;color:var(--tint)}
.sechead{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:4px}
.sechead h2{font-family:var(--display);font-weight:400;font-size:1.3rem;margin:0}
.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}

@property --ang{syntax:"<angle>";inherits:false;initial-value:0deg}

#aurora i:nth-child(2){width:60vmax;height:60vmax;right:-28vmax;top:10vh;background:radial-gradient(circle,#00b8ff 0%,transparent 60%);opacity:.38}
#aurora i:nth-child(3){width:55vmax;height:55vmax;left:10vw;bottom:-35vmax;background:radial-gradient(circle,#ff2fd0 0%,transparent 60%);opacity:.3}
#aurora::after{content:"";position:absolute;inset:0;background-image:linear-gradient(rgba(150,170,255,.05) 1px,transparent 1px),linear-gradient(90deg,rgba(150,170,255,.05) 1px,transparent 1px);background-size:44px 44px;mask-image:radial-gradient(ellipse at 50% 0%,#000 0%,transparent 70%);-webkit-mask-image:radial-gradient(ellipse at 50% 0%,#000 0%,transparent 70%)}

  #aurora i:nth-child(1){animation:drift1 26s ease-in-out infinite alternate}

}

const NUT_CACHE=new Map();
function nutFor(name){
  const n=name.toLowerCase();if(NUT_CACHE.has(n))return NUT_CACHE.get(n);
  const e=NUTRI.find(([re])=>re.test(n));NUT_CACHE.set(n,e);return e;
}
// Par portion. Les recettes sont écrites pour 2 ; on ajoute 15 g d'huile de cuisson pour 2 (≈ 1 c.s.).
function nutrition(r){
  if(r._nut)return r._nut;
  let k=0,p=0,g=0,l=0;
  r.ing.forEach(([nm,q,u])=>{
    const e=nutFor(nm);const opt=e[2]||{};
    const grams=q*(u===""?(opt.u||100):((opt.w&&opt.w[u])??UNIT_G[u]??10));
    const [kc,pp,gg,ll]=e[1];k+=grams*kc/100;p+=grams*pp/100;g+=grams*gg/100;l+=grams*ll/100;
  });
  if(!r.ing.some(([nm])=>/^huile/i.test(nm))){k+=135;l+=15}
  const o={kcal:Math.round(k/2/10)*10,p:Math.round(p/2),g:Math.round(g/2),l:Math.round(l/2)};
  r._nut=o;return o;
}

function normalize(o){
  const s=fresh();if(!o||typeof o!=="object")return s;
  if(Number.isInteger(o.p))s.p=Math.min(8,Math.max(1,o.p));
  ["done","notes"].forEach(k=>{if(o[k]&&typeof o[k]==="object")s[k]=o[k]});

const FILTERS=["Toutes","Favoris","Pour vous","Légères","Rapides","Sans viande","Poisson","Au four","Mes recettes","Exclues"];
function filtered(){
  const q=UI.q.trim().toLowerCase(),f=UI.filter;
  const l=all().filter(r=>{
    if(f==="Favoris"&&!S.fav.includes(r.id))return false;
    if(f==="Rapides"&&r.temps>30)return false;
    if(f==="Légères"&&nutrition(r).kcal>600)return false;
    if(f==="Sans viande"&&!isVeg(r))return false;
    if(f==="Poisson"&&r.prot!=="poisson")return false;
    if(f==="Au four"&&!r.four)return false;
    if(f==="Mes recettes"&&!r.mine)return false;
    if(f==="Exclues"&&!S.ban.includes(r.id))return false;
    if(q&&!(r.nom.toLowerCase().includes(q)||(r.cuisine||"").toLowerCase().includes(q)||(r.region||"").toLowerCase().includes(q)||r.ing.some(i=>i[0].toLowerCase().includes(q))))return false;
    return true;
  });
  return f==="Pour vous"?forFavs(l):l;
}

const DIFF=["","Facile","Moyen","Exigeant"];
function nutCard(r){
  const n=nutrition(r),kp=n.p*4,kg=n.g*4,kl=n.l*9,t=Math.max(1,kp+kg+kl);
  const C=2*Math.PI*36;let off=0;
  const seg=(v,cls)=>{const len=v/t*C;const o=`<circle class="${cls}" cx="44" cy="44" r="36" stroke-dasharray="${len.toFixed(1)} ${(C-len).toFixed(1)}" stroke-dashoffset="${(-off).toFixed(1)}"/>`;off+=len;return o};
  const pct=v=>Math.round(v/t*100);
  return `<div class="nut"><svg viewBox="0 0 88 88" class="donut" aria-hidden="true"><circle class="trk" cx="44" cy="44" r="36"/>${seg(kp,"mp")}${seg(kg,"mg")}${seg(kl,"ml")}</svg>
    <div class="nut-c"><b>${n.kcal}</b><span>kcal / portion</span></div>
    <ul class="macros"><li><i class="mp"></i>Protéines<b>${n.p} g</b><small>${pct(kp)} %</small></li><li><i class="mg"></i>Glucides<b>${n.g} g</b><small>${pct(kg)} %</small></li><li><i class="ml"></i>Lipides<b>${n.l} g</b><small>${pct(kl)} %</small></li></ul></div>
    <p class="note nutnote">Estimation par portion, accompagnement compris (riz, pain…) et 1 c.s. d’huile de cuisson pour 2. Écart possible de 15 à 20 %.</p>`;
}

const UNIT_MAP={g:["g",1],kg:["g",1000],ml:["ml",1],cl:["ml",10],l:["ml",1000],"c.s.":["c.s.",1],"cs":["c.s.",1],"c.c.":["c.c.",1],"cc":["c.c.",1],"boîte":["boîte",1],"boîtes":["boîte",1],"gousse":["gousse",1],"gousses":["gousse",1],"pot":["pot",1],"pots":["pot",1],"botte":["botte",1],"bottes":["botte",1],"sachet":["sachet",1],"sachets":["sachet",1],"morceau":["morceau",1],"morceaux":["morceau",1],"boule":["boule",1],"boules":["boule",1],"cube":["cube",1],"cubes":["cube",1],"pincée":["pincée",1],"pincées":["pincée",1]};
function guessRay(n){n=n.toLowerCase();
  if(/concass|conserve|bouillon|pâte|pates|riz|semoule|lentille|farine|sucre|miel|huile|olive|coco|tortilla|chapelure|nouille|haricots (rouges|noirs|blancs)|maïs/.test(n))return"E";
  if(/épice|sauce|curry|cumin|paprika|piment|sumac|ras el|curcuma|garam|herbes de|cannelle|vinaigre|soja|moutarde|muscade/.test(n))return"S";
  if(/poulet|bœuf|boeuf|porc|saumon|cabillaud|crevette|lardon|ventrèche|chorizo|jambon|dinde|agneau|poisson|steak|saucisse|merguez|veau|canard/.test(n))return"B";
  if(/œuf|oeuf|lait|yaourt|fromage|feta|parmesan|mozza|crème|beurre|cheddar|emmental|gnocchi|houmous|comté|ricotta/.test(n))return"C";
  if(/pain|baguette|naan|pita|brioche/.test(n))return"P";
  return"F";
}
function parseIng(line){
  const m=line.trim().match(/^(\d+(?:[.,]\d+)?|\d+\/\d+)\s*(kg|g|cl|ml|l|c\.s\.|cs|c\.c\.|cc|boîtes?|gousses?|pots?|bottes?|sachets?|morceaux?|boules?|cubes?|pincées?)?\.?\s+(?:de\s+|d’|d')?(.+)$/i);
  if(!m)return[line.trim(),1,"",guessRay(line)];
  let q=m[1].includes("/")?(+m[1].split("/")[0])/(+m[1].split("/")[1]):parseFloat(m[1].replace(",","."));
  let u="";if(m[2]){const map=UNIT_MAP[m[2].toLowerCase()];if(map){u=map[0];q*=map[1]}}
  const nom=m[3].charAt(0).toUpperCase()+m[3].slice(1);
  return[nom,q,u,guessRay(nom)];
}
function submitRecipe(){
  const v=id=>document.getElementById(id).value.trim();
  const err=document.getElementById("formErr");
  const nom=v("fNom"),ing=v("fIng").split("\n").filter(l=>l.trim()),st=v("fSteps").split("\n").filter(l=>l.trim());
  if(!nom){err.textContent="Donnez un nom à la recette.";return}
  if(!ing.length){err.textContent="Ajoutez au moins un ingrédient, un par ligne.";return}
  if(!st.length){err.textContent="Ajoutez au moins une étape.";return}
  const four=parseInt(v("fFour"),10);
  const r={id:"m"+Date.now(),mine:true,nom:nom.slice(0,90),cuisine:v("fCuisine").slice(0,30)||"Maison",prot:document.getElementById("fProt").value,
    temps:Math.min(600,Math.max(5,parseInt(v("fTemps"),10)||30)),four:four>=50&&four<=300?four:null,
    ing:ing.map(parseIng),steps:st.map(l=>{const mm=l.match(/\((\d+)\s*min\)\s*$/i);return[l.replace(/\(\d+\s*min\)\s*$/i,"").trim(),mm?+mm[1]:0]})};

  [0,.35,.7].forEach(t=>{const o=ac.createOscillator(),g=ac.createGain();o.frequency.value=880;o.connect(g);g.connect(ac.destination);
  g.gain.setValueAtTime(.0001,ac.currentTime+t);g.gain.exponentialRampToValueAtTime(.3,ac.currentTime+t+.02);g.gain.exponentialRampToValueAtTime(.0001,ac.currentTime+t+.3);o.start(ac.currentTime+t);o.stop(ac.currentTime+t+.32)})}catch(e){}}
function startTimer(min,label){

async function shrink(file){
  try{
    const bmp=await createImageBitmap(file,{imageOrientation:"from-image"});
    const sc=Math.min(1,1600/Math.max(bmp.width,bmp.height));
    const c=document.createElement("canvas");c.width=Math.round(bmp.width*sc);c.height=Math.round(bmp.height*sc);
    c.getContext("2d").drawImage(bmp,0,0,c.width,c.height);
    const b=await new Promise(res=>c.toBlob(res,"image/jpeg",.85));
    return b||file;
  }catch(e){return file}
}

  if(ds.dp!=null){const i=UI.sel,v=+ds.dp;if(v===0)delete S.week[i].p;else{const np=clampP(dayP(i)+v);if(np===S.p)delete S.week[i].p;else S.week[i].p=np}save();return render()}
  if(t.id==="vpMinus"||t.id==="vpPlus"){UI.viewP=clampP((UI.viewP||S.p)+(t.id==="vpPlus"?1:-1));const o=document.getElementById("vpOut");if(o){o.textContent=UI.viewP;const lb=o.nextElementSibling&&o.nextElementSibling.nextElementSibling;if(lb)lb.textContent="personne"+(UI.viewP>1?"s":"")}if(UI.sheetTab==="ing"){const st=document.getElementById("stab");if(st)st.innerHTML=sheetTab(byId(UI.openId))}return}
  if(t.id==="closeSheet")return closeSheet();
  if(t.id==="gen")return generate();
  if(t.id==="copyMenu")return copy(menuText(),"Menu copié");
  if(ds.daymenu!=null)return openDayMenu(+ds.daymenu);
  if(ds.swap!=null){const i=+ds.swap;S.week[i].d=pickFor(i,ids(),null);save();if(inSheet)closeSheet();render();return toast(`${JOURS[i]} : ${short(byId(S.week[i].d).nom)}`)}
  if(ds.clear!=null){S.week[+ds.clear]={d:null,x2:false};save();closeSheet();return render()}
  if(ds.x2!=null){const i=+ds.x2,w=S.week[i];w.x2=!w.x2;save();render();closeSheet();return toast(w.x2?`Quantités doublées, restes pour ${JOURS[i+1].toLowerCase()} midi`:"Restes annulés")}
  if(ds.pick!=null){UI.pick=+ds.pick;if(inSheet)closeSheet();UI.scroll[UI.tab]=window.scrollY;UI.tab="recettes";render();window.scrollTo(0,0);return}
  if(t.id==="cancelPick"){UI.pick=null;return goTab("semaine")}
  if(ds.assign){const i=UI.pick;S.week[i].d=ds.assign;UI.pick=null;save();goTab("semaine");return toast(`${JOURS[i]} : c’est noté`)}
  if(ds.filter){UI.filter=ds.filter;document.querySelectorAll("[data-filter]").forEach(b=>b.setAttribute("aria-pressed",String(b.dataset.filter===UI.filter)));document.getElementById("rlist").innerHTML=listHTML();return}
  if(ds.zone){UI.zone=ds.zone;return render()}
  if(ds.jump){const el=document.getElementById(ds.jump);if(el)el.scrollIntoView({behavior:reduced()?"auto":"smooth",block:"start"});return}
  if(ds.fav){const id=ds.fav;S.fav=toggleIn(S.fav,id);save();const on=S.fav.includes(id);
    document.querySelectorAll(`[data-fav="${CSS.escape(id)}"]`).forEach(b=>{b.setAttribute("aria-pressed",String(on));b.setAttribute("aria-label",on?"Retirer des favoris":"Ajouter aux favoris")});
    if(UI.tab==="recettes"&&(UI.filter==="Favoris"||UI.filter==="Pour vous")){const rl=document.getElementById("rlist");if(rl)rl.innerHTML=listHTML()}
    return toast(on?"Ajouté aux favoris":"Retiré des favoris")}
  if(ds.ban){const id=ds.ban;S.ban=toggleIn(S.ban,id);save();render();UI.sheetTab="more";openRecipe(id);return}
  if(ds.cookmode){const cp=ds.dayp!=null?dayP(+ds.dayp):(inSheet?UI.viewP:S.p);return openCook(ds.cookmode,cp)}
  if(ds.cook)return openRecipe(ds.cook,"steps");
  if(t.id==="cookClose")return closeCook(false);
  if(t.id==="cookPrev")return cookGo(UI.cook.i-1);
  if(t.id==="cookNext")return cookGo(UI.cook.i+1);
  if(t.id==="cookIng"){UI.cook.ing=!UI.cook.ing;return drawCook()}
  if(ds.sel!=null){UI.sel=+ds.sel;render();if(!t.closest(".wstrip"))window.scrollTo({top:0,behavior:reduced()?"auto":"smooth"});return}
  if(ds.open){if(!inSheet){UI.sheetTab="ing";UI.viewP=ds.dayp!=null?dayP(+ds.dayp):S.p}return openRecipe(ds.open)}
  if(ds.stab){UI.sheetTab=ds.stab;document.querySelectorAll("[data-stab]").forEach(b=>b.setAttribute("aria-pressed",String(b.dataset.stab===UI.sheetTab)));document.getElementById("stab").innerHTML=sheetTab(byId(UI.openId));return}
  if(ds.placeday!=null){const i=+ds.placeday;let rid=UI.openId;if(String(rid).startsWith("g"))rid=saveGen(rid);S.week[i].d=rid;if(UI.viewP&&UI.viewP!==S.p)S.week[i].p=UI.viewP;else delete S.week[i].p;save();closeSheet();render();return toast(`Au menu de ${JOURS[i].toLowerCase()}`)}
  if(t.id==="newRecipe")return openForm();
  if(ds.timer)return startTimer(+ds.timer,ds.tlabel);
  if(t.id==="stopTimer"){if(T)clearInterval(T.iv);T=null;return drawTimer()}
  if(t.id==="delRecipe"){
    if(!UI.confirmDel){UI.confirmDel=true;t.lastChild.textContent="Confirmer la suppression";return}
    const id=ds.del;S.mine=S.mine.filter(r=>r.id!==id);S.week.forEach(w=>{if(w.d===id)w.d=null});S.fav=S.fav.filter(x=>x!==id);S.ban=S.ban.filter(x=>x!==id);delete S.notes[id];
    save();closeSheet();render();return toast("Recette supprimée")}
  if(t.id==="pMinus"||t.id==="pPlus"){S.p=Math.min(8,Math.max(1,S.p+(t.id==="pPlus"?1:-1)));save();document.getElementById("pOut").textContent=S.p;return render()}
  if(t.id==="vMinus"||t.id==="vPlus"){S.cfg.veg=Math.min(4,Math.max(0,S.cfg.veg+(t.id==="vPlus"?1:-1)));save();document.getElementById("vOut").textContent=S.cfg.veg;return}
  if(ds.cfg){S.cfg[ds.cfg]=!S.cfg[ds.cfg];save();t.setAttribute("aria-pressed",String(S.cfg[ds.cfg]));return}
  if(ds.frigo){S.frigo=toggleIn(S.frigo,ds.frigo);save();t.setAttribute("aria-pressed",String(S.frigo.includes(ds.frigo)));return render()}
  if(t.id==="askClear"){UI.confirmClear=true;document.getElementById("clearSlot").innerHTML=clearBtn();return}
  if(t.id==="clearWeek"){S.week=S.week.map(()=>({d:null,x2:false}));S.done={};UI.confirmClear=false;save();closeSheet();render();return toast("Semaine vidée")}
  if(t.id==="exportData")return copy(JSON.stringify(S),"Données copiées");
  if(t.id==="importData"){const box=document.getElementById("importBox"),er=document.getElementById("importErr");
    try{const o=JSON.parse(box.value);if(!o||!Array.isArray(o.week))throw 0;S=normalize(o);save();closeSheet();render();toast("Données importées")}
    catch(_){er.textContent="Code non reconnu. Collez le texte complet copié depuis l’autre appareil."}return}
  if(t.id==="uncheck"){S.done={};save();return render()}
  if(ds.delx!=null){e.preventDefault();const name=S.extras[+ds.delx];S.extras.splice(+ds.delx,1);delete S.done["x|"+name];save();return render()}
  if(t.id==="copy")return copy(listText(),"Liste copiée");
});
document.addEventListener("change",e=>{
  if(e.target.id==="camIn"||e.target.id==="galIn"){addPhotos([...e.target.files]);e.target.value="";return}
  const k=e.target.dataset&&e.target.dataset.done;if(k==null)return;
  if(e.target.checked)S.done[k]=true;else delete S.done[k];save();
  const row=e.target.closest(".item");if(row)row.classList.toggle("done",e.target.checked);try{e.target.checked&&navigator.vibrate&&navigator.vibrate(8)}catch(_){}
  updateCourses();
});
document.addEventListener("input",e=>{
  if(e.target.id==="search"){UI.q=e.target.value;const rl=document.getElementById("rlist");if(rl)rl.innerHTML=listHTML();return}
  if(e.target.dataset&&e.target.dataset.note){const id=e.target.dataset.note,v=e.target.value;if(v.trim())S.notes[id]=v.slice(0,2000);else delete S.notes[id];save()}
});
document.addEventListener("keydown",e=>{if(UI.cook){if(e.key==="Escape")closeCook(false);if(e.key==="ArrowRight")cookGo(UI.cook.i+1);if(e.key==="ArrowLeft")cookGo(UI.cook.i-1);return}if(e.key==="Escape")closeSheet()});
document.addEventListener("submit",e=>{
  if(e.target.id==="addForm"){e.preventDefault();const inp=document.getElementById("addInput"),v=inp.value.trim();if(!v)return;
    if(!S.extras.includes(v))S.extras.push(v.slice(0,80));save();render();toast("Article ajouté");const n=document.getElementById("addInput");if(n)n.focus()}
  if(e.target.id==="recipeForm"){e.preventDefault();submitRecipe()}
});

render();
</script>

<script>
if("serviceWorker" in navigator){window.addEventListener("load",()=>{navigator.serviceWorker.register("sw.js").catch(()=>{})})}
</script>
</body>
</html>
